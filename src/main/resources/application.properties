# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/quickticket
spring.datasource.username=quickticket
spring.datasource.password=quickticket

# MyBatis 매퍼 SQL 로그 (학습용 — 실행되는 쿼리 확인)
logging.level.com.quickticket.event.mapper=debug

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Queue (임시 상수 — 부하 테스트 단계에서 실측치로 보정 예정)
quickticket.queue.processing-rate-per-sec=50

# Captcha 무작위 발동 시각 범위(초) — 대기 진입 후 이 범위 내 무작위 시점에 캡차 발동
quickticket.captcha.min-delay-sec=5
quickticket.captcha.max-delay-sec=20

# Admission 입장 제어 — 예매 구역(room) 최대 동시 인원과 입장 유지 시간
quickticket.admission.max-room=10
quickticket.admission.ttl-sec=300
quickticket.admission.scheduler-rate-ms=1000

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=quickticket
spring.kafka.consumer.auto-offset-reset=earliest

# Jackson (API 스펙의 result_code / event_nm 등 snake_case 응답)
spring.jackson.property-naming-strategy=SNAKE_CASE

# Actuator (Prometheus)
management.endpoints.web.exposure.include=health,prometheus
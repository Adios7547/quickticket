# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/quickticket
spring.datasource.username=quickticket
spring.datasource.password=quickticket

# MyBatis 매퍼 SQL 로그 (학습용 — 실행되는 쿼리 확인)
logging.level.com.quickticket.event.mapper=debug

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=quickticket
spring.kafka.consumer.auto-offset-reset=earliest

# Jackson (API 스펙의 result_code / event_nm 등 snake_case 응답)
spring.jackson.property-naming-strategy=SNAKE_CASE

# Actuator (Prometheus)
management.endpoints.web.exposure.include=health,prometheus